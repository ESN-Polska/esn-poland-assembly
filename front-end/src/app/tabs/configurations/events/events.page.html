<ion-header class="ion-no-border">
  <ion-toolbar color="ideaToolbar" *ngIf="app.isInMobileMode()">
    <ion-buttons slot="start">
      <ion-img [src]="app.getIcon(true)"></ion-img>
    </ion-buttons>
    <ion-title>{{ app.configurations.appTitle }}</ion-title>
  </ion-toolbar>
  <ion-toolbar color="ideaToolbar">
    <ion-buttons slot="start">
      <ion-button
        (click)="app.goToInTabs(isArchiveView() ? ['configurations', 'events'] : ['configurations'], { back: true })"
      >
        <ion-icon name="arrow-back" slot="end"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ (isArchiveView() ? 'EVENTS.ARCHIVE' : 'EVENTS.EVENTS') | translate }}</ion-title>
    <ion-button
      *ngIf="!isArchiveView()"
      fill="solid"
      color="ESNpink"
      (click)="app.goToInTabs(['configurations', 'events', 'archive'])"
    >
      <ion-icon icon="archive-outline" slot="icon-only" *ngIf="app.isInMobileMode()"></ion-icon>
      <ion-text *ngIf="!app.isInMobileMode()">{{ 'ARCHIVE.ARCHIVE' | translate }}</ion-text>
    </ion-button>
    <ion-button *ngIf="!isArchiveView()" fill="solid" color="ESNgreen" (click)="addEvent()">
      <ion-icon icon="add" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list class="aList maxWidthContainer">
    <ion-item lines="full" class="ion-text-center noElements" *ngIf="events && !events.length">
      <ion-label>{{ 'COMMON.NO_ELEMENTS' | translate }}</ion-label>
    </ion-item>
    <ion-item *ngIf="!events">
      <ion-label><ion-skeleton-text animated></ion-skeleton-text></ion-label>
    </ion-item>
    <ion-item *ngFor="let event of events" button (click)="openEvent(event)">
      <ion-label>{{ event.name }}</ion-label>
    </ion-item>
    <ion-infinite-scroll (ionInfinite)="paginate($event?.target)">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </ion-list>
</ion-content>
