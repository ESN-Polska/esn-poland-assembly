<ion-item button *ngIf="question" [detail]="!!current" [class.current]="!!current" (click)="select.emit()">
  <ion-avatar slot="start" (click)="$event.stopPropagation(); app.openUserProfile(question.creator)" style="cursor: pointer;">
    <img
      [src]="question.creator.avatarURL || app.getAvatarFallbackURL()"
      (error)="app.fallbackAvatar($event.target)"
      alt=""
    />
  </ion-avatar>
  <ion-label class="ion-text-wrap">
    {{ question.summary }}
    <p>
      {{ 'QUESTIONS.BY' | translate | lowercase }}
      <b (click)="$event.stopPropagation(); app.openUserProfile(question.creator)" style="cursor: pointer;">{{ question.creator.name }}</b>
      <br />
      {{ 'QUESTIONS.ON' | translate | lowercase }}
      {{ question.createdAt | dateTz }}
    </p>
  </ion-label>
  <div slot="end" class="ion-text-center questionStats" [class.mobile]="app.isInMobileMode()">
    <ion-chip color="medium" disabled>
      <ion-icon name="chatbubbles"></ion-icon>
      <ion-label>{{ question.numOfAnswers }}</ion-label>
    </ion-chip>
    <ion-chip color="success" disabled>
      <ion-icon name="thumbs-up"></ion-icon>
      <ion-label>{{ question.numOfUpvotes }}</ion-label>
    </ion-chip>
    <ion-chip color="ESNpink" disabled>
      <ion-icon icon="assets/icons/clap.svg"></ion-icon>
      <ion-label>{{ question.numOfClaps }}</ion-label>
    </ion-chip>
  </div>
</ion-item>
<!-- skeleton -->
<ion-item *ngIf="!question">
  <ion-avatar slot="start">
    <ion-skeleton-text animated></ion-skeleton-text>
  </ion-avatar>
  <ion-label>
    <ion-skeleton-text animated style="width: 80%"></ion-skeleton-text>
  </ion-label>
</ion-item>
