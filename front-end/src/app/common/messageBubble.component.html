<div class="bubble" *ngIf="text || creator" [class.bubbleSender]="isSender">
  <app-subject color="transparent" lines="none" [subject]="creator"></app-subject>
  <div class="internalPSpacing" *ngIf="sanitizedHtml" [innerHtml]="sanitizedHtml"></div>
</div>
<ng-content></ng-content>
<!--skeleton-->
<div class="bubble" *ngIf="!text && !creator" [class.bubbleSender]="isSender">
  <ion-skeleton-text animated></ion-skeleton-text>
</div>
